# Appreciation Bot on Fly.io: a Socket Mode Slack worker with no public port.
# Data lives in Supabase (project appreciation-bot); nothing on local disk.
# Deploy: fly deploy --remote-only
# Secrets (fly secrets): SLACK_BOT_TOKEN, SLACK_APP_TOKEN, SLACK_SIGNING_SECRET,
#   GIPHY_API_KEY, DATABASE_URL
app = "dao-appreciation-bot"
primary_region = "iad"

# node-cron runs on local time; Railway and Fly default to UTC, so the
# "9 AM" digest and leaderboard posted at 5 AM Eastern until this was set.
[env]
  TZ = "America/New_York"

[build]
  dockerfile = "Dockerfile"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
